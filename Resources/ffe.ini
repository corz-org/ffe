;
; The Presets..
;
; The [section] is the preset name (as it appears in ffe's menu). For this
; reason, using square brackets [] in your preset names is not permitted.
;
; Any section that ffe doesn't recognise (e.g. buttons, mappings, etc.) is
; considered a preset, and will appear in the presets drop-down.
;
; Note: you can keep multiple copies of a preset, if you so wish. ffe will use
; only the first one it finds, and ignore the rest. In this way, you can keep
; backups of presets; a quick copy-paste in your ini file. When you wipe a
; preset from the GUI, an automatic backup is created (which you can restore
; from the GUI, if required).
;
; Here's some example presets, with a few not-quite-random settings added..

[FLAC (True Stereo)]
v_codec=- disable video -
a_codec=flac
raw_params= -compression_level 12 -ch_mode indep
notes=\nFree Lossless Audio Codec:\nMaximum Compression.\nIndependent L/R channel encoding.
[MP3]
v_codec=- disable video -
a_codec=libmp3lame
[MP3 (True Stereo)]
v_codec=- disable video -
a_codec=libmp3lame
raw_params=-vn -ac 2 -joint_stereo 0 -qscale:a 0
notes=\nThis creates a "true" L/R stereo file.\nAnd probably wastes some data doing it.
[x264 Simple]
; a simple, default conversion..
v_codec=libx264
a_codec=libmp3lame
outputfile=@parent\OUT
[x265 Simple]
; a simple, default conversion..
v_codec=libx265
a_codec=aac
outputfile=@parent\OUT
[x265:AAC:Slow:CRF22-HQ]
v_codec=libx265
a_codec=aac
raw_params=-preset slow -x265-params crf=22
[x265:AAC:Slow:CRF25-MQ]
v_codec=libx265
a_codec=aac
raw_params=-preset slow -x265-params crf=25
[x264 Slow crf 18 (MAX Q) Copy Audio]
v_codec=libx264
a_codec=copy
raw_params=-preset slow -crf 18
[x264 medium preset crf=22 (HQ) Copy Audio]
v_codec=libx264
a_codec=copy
raw_params=-preset medium -crf 22
[Evo 3D (Phone) (960x540,MP4,x264,AAC) 150% Volume]
v_codec=libx264
x_size=960
y_size=540
a_codec=libvo_aacenc
raw_params=-vol 384
[SpeedUp x2]
v_codec=libx265
a_codec=aac
raw_params=-preset medium -crf 22 -filter:v "setpts=0.50*PTS" -filter:a "atempo=2.0"
[Reverse Video+Audio]
v_codec=libx265
a_codec=aac
raw_params=-preset medium -crf 22 -vf reverse -af areverse
[WebM:OGG]
v_codec=libvpx-vp9
a_codec=libvorbis
raw_params=-f webm -g 120 -qmax 42 -qmin 10 -vb 2M -aq 90 -ac 2
[WEBM:Opus:CQ]
v_codec=libvpx-vp9
a_codec=libopus
raw_params=-crf 30 -b:v 0
notes=\nConstant Quality Encoding:\n\nTo trigger this mode, you must use a combination of -crf and -b:v 0. Note that -b:v MUST be 0.\nSetting it to anything higher or omitting it entirely will instead invoke the Constrained Quality mode.\n\nsee: http://trac.ffmpeg.org/wiki/Encode/VP9
[AV1 Simple Test]
v_codec=libsvtav1
a_codec=libopus
raw_params= -rc 2 -preset 4
[Copy to MKV Container]
v_codec=copy
a_codec=copy
raw_params=-map 0
[Add Subtitles]
input_params=-i "I:\subs.srt"
raw_params=-c:v copy -c:a copy -c:s srt -map 0 -map 1 -preset medium -x265-params crf=22
notes=\nChange the paths to match your own files!
[Add MANY Subtitles]
input_params=-i "B:\TEMP\English.srt" -i "B:\TEMP\Dutch.srt" -i "B:\TEMP\French.srt" -i "B:\TEMP\German.srt" -i "B:\TEMP\Portuguese.srt" -i "B:\TEMP\Spanish.srt"
raw_params=-c:v copy -c:a copy -c:s srt -map 0 -map 1 -map 2 -map 3 -map 4 -map 5 -map 6 -metadata:s:s:0 language=eng -metadata:s:s:1 language=nl -metadata:s:s:2 language=fre -metadata:s:s:3 language=de -metadata:s:s:4 language=por -metadata:s:s:5 language=es
do_matof=false
[Extract Subtitles]
raw_params=-map 0:s:0 @parent\subtitles.srt
do_output=false
[Video > PNGs (1/s)]
v_codec=png
a_codec=- disable audio -
raw_params= -r 1 "@parent\OUT\@item_%05d.png"
do_output=false
notes=\nDon't forget to disable the output (if it isn't already). And create the "OUT" directory!
